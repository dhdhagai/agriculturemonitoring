<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Logged out - Agriculture Monitoring</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
		<link rel="stylesheet" href="modern.css">
	</head>
	<body>
		<script>let page = "login";</script>
		<div id="hm-nav"></div>

		<main class="container text-center my-5">
			<div class="card mx-auto" style="max-width:560px;">
				<div class="card-body">
					<h3 class="card-title">You're signed out</h3>
					<p class="text-muted">We cleared your session details. You will be redirected to the home page shortly.</p>
					<p id="countdown" class="lead">Redirecting in 3s...</p>
					<p>
						<a href="/" class="btn btn-outline-primary me-2">Go to Home now</a>
						<a href="login.html" class="btn btn-primary">Sign in again</a>
					</p>
				</div>
			</div>
		</main>

		<div id="hm-footer"></div>

		<script>
			// clear LOGIN_DETAILS cookie (and be permissive about path)
			function clearLoginCookie() {
				document.cookie = 'LOGIN_DETAILS=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
			}

			// perform clear and redirect countdown
			(function(){
				clearLoginCookie();
				let t = 3;
				const el = document.getElementById('countdown');
				const id = setInterval(() => {
					t -= 1;
					if (el) el.textContent = 'Redirecting in ' + t + 's...';
					if (t <= 0) {
						clearInterval(id);
						window.location.href = '/';
					}
				}, 1000);
			})();
		</script>

		<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
		<script src="dark-mode-switch.min.js"></script>
		<script src="dark.js"></script>
	</body>
</html>
